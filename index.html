<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeRevise – revise HTML, CSS, JavaScript and Python topic by topic with live examples and practice questions." />
    <title>CodeRevise – Learn &amp; Revise Web Development</title>
    <script>
      // apply the saved theme before first paint (light is the default)
      try {
        var t = JSON.parse(localStorage.getItem('cr:theme'))
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
